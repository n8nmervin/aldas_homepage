<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Specialist Profile</title>
  <link rel="stylesheet" href="profile-style.css">
</head>
<body>

  <div class="profile-container">
    <a href="index.html" class="back-btn">← Back to Specialists</a>

    <div class="profile-header">
      <img id="doc-img" src="" alt="Profile Photo" class="profile-img">
      <div class="profile-title">
        <h1 id="doc-name">Loading...</h1>
        <h2 id="doc-role"></h2>
        <span id="doc-category" class="badge"></span>
      </div>
    </div>

    <div class="profile-body">
      <h3>About</h3>
      <p id="doc-about"></p>

      <h3>Specializations & Services</h3>
      <ul id="doc-services"></ul>

      <a href="#" class="book-btn">Book Appointment</a>
    </div>
  </div>

  <script src="profile.js"></script>
</body>
</html>
